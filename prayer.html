<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Prayer — Shalom Ministry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3A;
    --ink-2:#233A50;
    --parchment:#F7F2E8;
    --parchment-2:#EFE7D8;
    --gold:#C89B3C;
    --gold-2:#E4BE6E;
    --charcoal:#2B2620;
    --white:#FFFFFF;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--charcoal);
    background:var(--parchment);
    line-height:1.6;
  }
  a{text-decoration:none; color:inherit;}
  ul{list-style:none;}
  .container{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.1rem;
    letter-spacing:0.08em;
    color:var(--gold-2);
  }

  /* HEADER (matches homepage) */
  header{
    position:sticky; top:0; z-index:100;
    background:var(--ink);
  }
  .nav-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 24px;
    max-width:1180px;
    margin:0 auto;
  }
  .nav-links{
    display:flex;
    gap:34px;
  }
  .nav-links a{
    color:var(--parchment);
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:6px 2px;
    border-bottom:2px solid transparent;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .nav-links a:hover{ color:var(--gold-2); border-bottom-color:var(--gold); }
  .nav-links a.current{ color:var(--gold-2); border-bottom-color:var(--gold); }
    .nav-links a.home-link{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--gold-2);
    background:rgba(228,190,110,0.1);
    border:1px solid rgba(228,190,110,0.35);
    border-radius:20px;
    padding:6px 14px;
  }
  .nav-links a.home-link:hover{
    background:rgba(228,190,110,0.2);
    border-color:var(--gold);
    color:var(--gold-2);
  }
  .nav-links a.home-link svg{
    width:14px; height:14px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
  }
.nav-cta{ display:flex; align-items:center; gap:18px; }
  .btn{
    display:inline-block;
    padding:11px 22px;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border-radius:var(--radius);
  }
  .btn-gold{ background:var(--gold); color:var(--ink); }
  .btn-outline{ border:1px solid rgba(247,242,232,0.4); color:var(--parchment); }
  @media (max-width:900px){
    .nav-links{ display:none; }
  }

  /* PAGE HERO */
  .page-hero{
    background:var(--ink);
    color:var(--parchment);
    padding:80px 0 68px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .page-hero::after{
    content:"";
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:64px; height:2px;
    background:var(--gold);
  }
  .page-hero h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2.4rem, 5.5vw, 3.8rem);
    margin-top:14px;
    letter-spacing:-0.01em;
  }
  .page-hero .sub{
    margin-top:16px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.25rem;
    color:#C9D2DA;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }

  /* FORM */
  .prayer-section{
    padding:90px 0 110px;
  }
  .prayer-card{
    max-width:600px;
    margin:0 auto;
    background:var(--white);
    border:1px solid #E4DAC2;
    border-radius:10px;
    padding:44px 40px;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  input, textarea{
    padding:14px;
    border:1px solid #C9BFA3;
    border-radius:4px;
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
  }
  textarea{ resize:vertical; }
  button{
    background:var(--ink);
    color:var(--white);
    border:none;
    padding:15px;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border-radius:4px;
    cursor:pointer;
    transition:background 0.2s ease;
  }
  button:hover{ background:var(--ink-2); }
  #formStatus{ font-size:0.9rem; text-align:center; }

  footer{
    background:#14202D;
    color:#B9C2CB;
    padding:36px 0;
    text-align:center;
    font-size:0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="nav-bar">
    <a href="index.html" style="display:flex; align-items:center; gap:12px;">
      <img src="images/logo.png" alt="Shalom Lord Is Peace Ministry" style="height:56px; border-radius:50%;">
      <span style="font-family:'Fraunces', serif; font-size:1.05rem; font-weight:500; color:var(--gold-2); line-height:1.2;">
        SHALOM MINISTRY<br><span style="font-weight:400; color:var(--parchment);">The Lord Is Peace</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="home-link"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>Home</a>
      <a href="ministries.html">Ministries</a>
      <a href="services.html">Services</a>
      <a href="events.html">Events</a>
      <a href="prayer.html" class="current">Prayer Request</a>
      <a href="give.html">Give</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<section class="page-hero">
  <p class="eyebrow">We're Here For You</p>
  <h1>Request Prayer</h1>
  <p class="sub">Share what's on your heart — our team reads and prays over every request.</p>
</section>

<section class="prayer-section">
  <div class="container">
    <div class="prayer-card">
      <form id="prayerForm">
        <input type="text" id="pName" placeholder="Your Name" required>
        <input type="text" id="pEmail" placeholder="Your Phone or Email" required>
        <textarea id="pMessage" placeholder="Your prayer request..." rows="6" required></textarea>
        <label style="display:flex; align-items:flex-start; gap:10px; font-size:0.85rem; color:#5c5445; line-height:1.5; cursor:pointer;">
          <input type="checkbox" id="pConfirm" required style="margin-top:3px; width:16px; height:16px; flex-shrink:0;">
          <span>I understand this request is confidential and will only be viewed by our pastoral team.</span>
        </label>
        <button type="submit">Submit Request</button>
        <p id="formStatus"></p>
      </form>
    </div>
  </div>
</section>

<footer>
  &copy; 2026 Shalom Lord Is Peace Ministry. All rights reserved.
</footer>

<script>
  const prayerForm = document.getElementById('prayerForm');
  const formStatus = document.getElementById('formStatus');

  prayerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('pName').value;
    const email = document.getElementById('pEmail').value;
    const message = document.getElementById('pMessage').value;

    try {
      const response = await fetch('/api/prayer-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, message })
      });

      if (response.ok) {
        formStatus.style.color = 'green';
        formStatus.textContent = 'Thank you — your request has been received.';
        prayerForm.reset();
      } else {
        formStatus.style.color = 'red';
        formStatus.textContent = 'Something went wrong. Please try again.';
      }
    } catch (err) {
      formStatus.style.color = 'red';
      formStatus.textContent = 'Could not connect to the server.';
    }
  });
</script>

</body>
</html>
