<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Sign-Up — Shalom Ministry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3A; --ink-2:#233A50; --parchment:#F7F2E8; --parchment-2:#EFE7D8;
    --gold:#C89B3C; --gold-2:#E4BE6E; --charcoal:#2B2620; --white:#FFFFFF; --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; color:var(--charcoal); background:var(--parchment); line-height:1.6; }
  img{max-width:100%; display:block;}
  a{text-decoration:none; color:inherit;}
  .container{ max-width:1180px; margin:0 auto; padding:0 24px; }
  .eyebrow{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:1.1rem; letter-spacing:0.08em; color:var(--gold-2); }

  header{ position:sticky; top:0; z-index:100; background:var(--ink); }
  .nav-bar{ display:flex; align-items:center; justify-content:space-between; padding:10px 24px; max-width:1180px; margin:0 auto; }
  .nav-links{ display:flex; gap:34px; }
  .nav-links a{
    color:var(--parchment); font-size:0.82rem; font-weight:600; letter-spacing:0.06em;
    text-transform:uppercase; padding:6px 2px; border-bottom:2px solid transparent;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .nav-links a:hover{ color:var(--gold-2); border-bottom-color:var(--gold); }
  .nav-links a.current{ color:var(--gold-2); border-bottom-color:var(--gold); }
  .nav-links a.home-link{
    display:flex; align-items:center; gap:6px; color:var(--gold-2);
    background:rgba(228,190,110,0.1); border:1px solid rgba(228,190,110,0.35);
    border-radius:20px; padding:6px 14px;
  }
  .nav-links a.home-link:hover{ background:rgba(228,190,110,0.2); border-color:var(--gold); color:var(--gold-2); }
  .nav-links a.home-link svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; }
  .nav-cta{ display:flex; align-items:center; gap:18px; }
  @media (max-width:900px){ .nav-links{ display:none; } }

  .page-hero{ background:var(--ink); color:var(--parchment); padding:80px 0 68px; text-align:center; position:relative; overflow:hidden; }
  .page-hero::after{ content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:64px; height:2px; background:var(--gold); }
  .page-hero h1{ font-family:'Fraunces', serif; font-weight:600; color:var(--parchment); font-size:clamp(2.4rem, 5.5vw, 3.8rem); margin-top:14px; letter-spacing:-0.01em; }
  .page-hero .sub{ margin-top:16px; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:1.25rem; color:#C9D2DA; max-width:560px; margin-left:auto; margin-right:auto; }

  .signup-section{ padding:90px 0 110px; }
  .signup-card{
    max-width:600px; margin:0 auto; background:var(--white);
    border:1px solid #E4DAC2; border-radius:10px; padding:44px 40px;
  }
  form{ display:flex; flex-direction:column; gap:18px; }
  label.field{ display:flex; flex-direction:column; gap:6px; font-size:0.8rem; font-weight:600; letter-spacing:0.04em; color:#5c5445; text-transform:uppercase; }
  input, select{
    padding:14px; border:1px solid #C9BFA3; border-radius:4px;
    font-family:'Inter', sans-serif; font-size:0.95rem; background:var(--white);
    text-transform:none; letter-spacing:normal; font-weight:400; color:var(--charcoal);
  }
  button{
    background:var(--ink); color:var(--white); border:none; padding:15px;
    font-size:0.85rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    border-radius:4px; cursor:pointer; transition:background 0.2s ease;
  }
  button:hover{ background:var(--ink-2); }
  #formStatus{ font-size:0.9rem; text-align:center; }

  footer{ background:#14202D; color:#B9C2CB; padding:36px 0; text-align:center; font-size:0.8rem; }
</style>
</head>
<body>

<header>
  <div class="nav-bar">
    <a href="index.html" style="display:flex; align-items:center; gap:12px;">
      <img src="images/logo.png" alt="Shalom Lord Is Peace Ministry" style="height:56px; border-radius:50%;">
      <span style="font-family:'Fraunces', serif; font-size:1.05rem; font-weight:500; color:var(--gold-2); line-height:1.2;">
        SHALOM MINISTRY<br><span style="font-weight:400; color:var(--parchment);">The Lord Is Peace</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="home-link"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>Home</a>
      <a href="ministries.html">Ministries</a>
      <a href="services.html">Services</a>
      <a href="events.html" class="current">Events</a>
      <a href="prayer.html">Prayer Request</a>
      <a href="give.html">Give</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<section class="page-hero">
  <p class="eyebrow">Reserve Your Spot</p>
  <h1>Event Sign-Up</h1>
  <p class="sub">Let us know you're coming and we'll be ready to welcome you.</p>
</section>

<section class="signup-section">
  <div class="container">
    <div class="signup-card">
      <form id="signupForm">
        <label class="field">Event
          <select id="sEvent" required>
            <option value="" disabled selected>Choose an event</option>
            <option>Community Talks</option>
            <option>Young Adults Night</option>
            <option>Serve Teams</option>
            <option>Bible Reading Plan</option>
            <option>Community Outreach</option>
            <option>Baptism Sunday</option>
          </select>
        </label>
        <label class="field">Your Name
          <input type="text" id="sName" placeholder="Full name" required>
        </label>
        <label class="field">Phone or Email
          <input type="text" id="sContact" placeholder="So we can reach you" required>
        </label>
        <button type="submit">Sign Me Up</button>
        <p id="formStatus"></p>
      </form>
    </div>
  </div>
</section>

<footer>
  &copy; 2026 Shalom Lord Is Peace Ministry. All rights reserved.
</footer>

<script>
  // Preselect the event if we arrived from an event card (?event=Young%20Adults%20Night)
  const params = new URLSearchParams(window.location.search);
  const preselected = params.get('event');
  if (preselected) {
    const select = document.getElementById('sEvent');
    for (const opt of select.options) {
      if (opt.text === preselected) { select.value = opt.text; break; }
    }
  }

  const signupForm = document.getElementById('signupForm');
  const formStatus = document.getElementById('formStatus');

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const event_name = document.getElementById('sEvent').value;
    const name = document.getElementById('sName').value;
    const contact = document.getElementById('sContact').value;

    try {
      const response = await fetch('/api/event-signups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event_name, name, contact })
      });

      if (response.ok) {
        formStatus.style.color = 'green';
        formStatus.textContent = "You're signed up — we look forward to seeing you!";
        signupForm.reset();
      } else {
        formStatus.style.color = 'red';
        formStatus.textContent = 'Something went wrong. Please try again.';
      }
    } catch (err) {
      formStatus.style.color = 'red';
      formStatus.textContent = 'Could not connect to the server.';
    }
  });
</script>

</body>
</html>
