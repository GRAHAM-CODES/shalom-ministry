<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Shalom Ministry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3A; --parchment:#F7F2E8; --parchment-2:#EFE7D8;
    --gold:#C89B3C; --gold-2:#E4BE6E; --sage:#5F7D64; --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--parchment); color:#2B2620; line-height:1.6; }
  .container{ max-width:820px; margin:0 auto; padding:0 24px 80px; }
  header{ background:var(--ink); padding:28px 0; margin-bottom:32px; }
  header .container{ padding-bottom:0; display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-family:'Fraunces', serif; color:var(--parchment); font-size:1.4rem; }
  header .count{ color:var(--gold-2); font-size:0.85rem; font-weight:600; }

  .tabs{ display:flex; gap:10px; margin-bottom:24px; }
  .tab{
    background:var(--white); color:var(--ink); border:1px solid #E4DAC2;
    padding:10px 20px; font-size:0.78rem; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; border-radius:3px; cursor:pointer;
  }
  .tab.active{ background:var(--ink); color:var(--parchment); border-color:var(--ink); }
  .refresh-btn{
    background:var(--gold); color:var(--ink); border:none; padding:10px 20px;
    font-size:0.78rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    border-radius:3px; cursor:pointer; margin-left:auto;
  }
  .refresh-btn:hover{ background:var(--gold-2); }

  .card{
    background:var(--white); border:1px solid #E4DAC2; border-radius:8px;
    padding:22px 24px; margin-bottom:16px;
  }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
  .card-name{ font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; color:var(--ink); }
  .card-date{ font-size:0.75rem; color:var(--sage); white-space:nowrap; }
  .card-contact{ font-size:0.85rem; color:#8B7C55; margin-bottom:10px; }
  .card-message{ font-size:0.94rem; color:#3a352d; white-space:pre-wrap; }
  .event-badge{
    display:inline-block; font-size:0.68rem; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--gold); border:1px solid var(--gold);
    border-radius:20px; padding:3px 12px;
  }
  .empty-state, .loading{ text-align:center; color:#8B7C55; padding:50px 20px; }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Admin</h1>
    <span class="count" id="countLabel"></span>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" id="tabPrayer" onclick="switchTab('prayer')">Prayer Requests</button>
    <button class="tab" id="tabSignups" onclick="switchTab('signups')">Event Sign-Ups</button>
    <button class="refresh-btn" onclick="load()">Refresh</button>
  </div>
  <div id="list" class="loading">Loading...</div>
</div>

<script>
  let currentTab = 'prayer';

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabPrayer').classList.toggle('active', tab === 'prayer');
    document.getElementById('tabSignups').classList.toggle('active', tab === 'signups');
    load();
  }

  async function load() {
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('countLabel');
    listEl.className = 'loading';
    listEl.textContent = 'Loading...';

    const url = currentTab === 'prayer' ? '/api/prayer-requests' : '/api/event-signups';
    const noun = currentTab === 'prayer' ? 'request' : 'sign-up';

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('Failed');
      const rows = await response.json();

      countEl.textContent = rows.length + ' ' + noun + (rows.length === 1 ? '' : 's');
      listEl.className = '';

      if (rows.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
        return;
      }

      if (currentTab === 'prayer') {
        listEl.innerHTML = rows.map(r => `
          <div class="card">
            <div class="card-top">
              <span class="card-name">${esc(r.name)}</span>
              <span class="card-date">${fmt(r.created_at)}</span>
            </div>
            <div class="card-contact">${esc(r.email)}</div>
            <div class="card-message">${esc(r.message)}</div>
          </div>`).join('');
      } else {
        listEl.innerHTML = rows.map(r => `
          <div class="card">
            <div class="card-top">
              <span class="card-name">${esc(r.name)}</span>
              <span class="card-date">${fmt(r.created_at)}</span>
            </div>
            <div class="card-contact">${esc(r.contact)}</div>
            <span class="event-badge">${esc(r.event_name)}</span>
          </div>`).join('');
      }
    } catch (err) {
      listEl.className = 'empty-state';
      listEl.textContent = 'Could not load. Try refreshing.';
    }
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function fmt(iso) {
    const d = new Date(iso + 'Z');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  load();
</script>

</body>
</html>
